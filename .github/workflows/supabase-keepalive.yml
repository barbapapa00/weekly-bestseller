name: Supabase 깨어 있게 유지

# Supabase 무료 플랜은 7일간 사용이 없으면 프로젝트를 일시정지해요.
# 월요일 수집 사이 중간(목요일)에 데이터를 한 번 읽어 '사용 중' 상태로 유지합니다.
on:
  schedule:
    - cron: "0 0 * * 4"   # 매주 목요일 00:00 UTC = 한국 시간 오전 9시
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Supabase에서 최신 데이터 1건 읽기 (공개용 키 사용)
        run: |
          URL=$(grep -oP 'url:\s*"\K[^"]+' docs/config.js)
          KEY=$(grep -oP 'key:\s*"\K[^"]+' docs/config.js)
          curl -fsS "$URL/rest/v1/snapshots?select=week_start&order=week_start.desc&limit=1" -H "apikey: $KEY"
